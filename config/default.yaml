# Default Configuration for UltraScript Tools MCP
# This file provides default settings for all environments
# Override specific values in environment-specific config files

# Environment settings
environment: development
debug: true

# MCP Server Configuration
mcp:
  embedding:
    # Embedding model configuration
    #
    # 🏆 DEFAULT: Best quality with 8192 tokens (TEI Docker - Local Inference)
    model: "ibm-granite/granite-embedding-english-r2"  # 8192 tokens, English
    #
    # ALTERNATIVE OPTIONS:
    # TEI (Local Docker, 8192 tokens max):
    # model: "ibm-granite/granite-embedding-small-english-r2"  # 8192 tokens, fast
    #
    # OLLAMA (Local inference, 512 tokens max):
    # model: "ibm/granite-embedding:278m"  # Multilingual (English + Russian)
    # model: "ibm/granite-embedding:30m"   # Fast English-only version
    #
    # HUGGING FACE CLOUD API (8192 tokens, requires API key):
    # model: "ibm-granite/granite-embedding-english-r2"  # 8192 tokens, English

    provider: "tei"          # Options: tei (local Docker), huggingface (cloud API), ollama, memory, auto
    enabled: false           # Set to true after running setup-tei.sh/.cmd (or use auto for auto-detection)
    fallbackToMemory: true   # Gracefully fallback to memory-based similarity when model unavailable
    apiKey: ""               # Only for cloud providers (huggingface, openai, cloudru)

    # Optional: Two-stage retrieval with reranker (Ollama only, not for HuggingFace)
    useReranker: false
    rerankerModel: "ibm/granite-embedding-reranker:149m"
    rerankerTopK: 100   # First stage candidates
    rerankerFinalK: 10  # Final refined results

    # Language hint for optimization (doesn't restrict queries)
    # Options: "english" | "multilingual"
    queryLanguage: "english"  # Set to "multilingual" if using ibm/granite-embedding:278m or granite-embedding

    # TEI (Text Embeddings Inference) Configuration
    # Local Docker inference with 8192-token models
    tei:
      baseUrl: "http://127.0.0.1:8080"  # TEI server URL (Docker container)
      timeoutMs: 30000                  # 30 seconds timeout
      concurrency: 4                    # Parallel requests
      checkServer: true                 # Auto-start Docker container if stopped

    # HuggingFace Cloud API Configuration (alternative to TEI for cloud usage)
    # Requires API key from https://huggingface.co/settings/tokens
    # huggingface:
    #   apiKey: ""                      # Set via MCP_EMBEDDING_API_KEY env variable
    #   baseUrl: "https://api-inference.huggingface.co/models"
    #   timeoutMs: 30000
    #   concurrency: 4

  server:
    host: "localhost"
    port: 3000
    timeout: 120000     # 2 minutes for large indexing operations

  agents:
    maxConcurrent: 5    # Maximum concurrent agent operations
    defaultTimeout: 90000  # 90 seconds for large batches (Python/Kotlin)
    useParser: true     # Enable ParserAgent for AST parsing (MCP_USE_PARSER)
    devIndexBatch: 100  # Batch size for file processing (MCP_DEV_INDEX_BATCH)

# Database Configuration
database:
  path: ""              # Empty = use centralized storage (%LOCALAPPDATA%/UltraScriptTools/projects/<hash>/)
  mode: "WAL"           # Options: WAL, DELETE, TRUNCATE
  cacheSize: 10000      # SQLite cache size
  mmapSize: 268435456   # 256MB memory mapping size
  synchronous: "NORMAL" # Options: OFF, NORMAL, FULL
  tempStore: "MEMORY"   # Options: DEFAULT, FILE, MEMORY

# Vector Backend Configuration (Adaptive Switching)
# Automatically selects optimal backend based on codebase size:
# - Small/Medium (<10k vectors): sqlite-vec (exact search, fast insert)
# - Large (>10k vectors): vectorlite (HNSW, 3-100x faster search)
vectorBackend:
  # Backend selection: "auto" (recommended), "vectorlite", "sqlite-vec", "fallback"
  backend: "auto"

  # Threshold for automatic switching (in number of vectors)
  autoSwitchThreshold: 10000

  # Vectorlite HNSW configuration (used for large codebases)
  vectorlite:
    maxElements: 100000       # Maximum number of vectors
    M: 16                     # Connections per layer (higher = better recall, more memory)
    efConstruction: 200       # Index build quality (higher = better quality, slower build)
    efSearch: 50              # Search quality (higher = better accuracy, slower search)
    distanceMetric: "l2"      # Options: l2, cosine, ip

# Logging Configuration
logging:
  level: "info"         # Options: debug, info, warn, error
  format: "text"        # Options: json, text
  enableConsole: true   # Enable console output
  outputFile: ""        # Optional log file path
  maxFileSize: "10MB"   # Maximum size per log file
  maxFiles: 5           # Maximum number of log files to keep

# Parser Configuration (Native Parsers)
# Uses language-native tooling: TypeScript Compiler API, Python ast, go/parser, etc.
parser:
  # Supported languages (requires corresponding runtime installed)
  # - typescript/javascript: Built-in (TypeScript Compiler API)
  # - python: Requires Python 3.8+ (uses ast module)
  # - java/kotlin: Requires JRE 11+ (uses compiler API)
  # - go: Requires Go 1.18+ (uses go/parser)
  # - rust: Requires Rust toolchain (uses rust-analyzer)
  # - c/cpp: Requires Clang 12+ (uses libclang)
  languages:
    - "typescript"
    - "javascript"
    - "python"
    - "c"
    - "cpp"
    - "java"
    - "kotlin"
    - "rust"
    - "go"
  maxFileSize: 1048576  # 1MB maximum file size for parsing
  timeout: 60000        # 60 seconds for large batches
    
  incremental:
    enabled: true
    cacheSize: 1000       # Number of parsed files to cache
    cacheTTL: 300000      # 5 minutes cache TTL
    
  agent:
    maxConcurrency: 4     # Parallel file processing
    memoryLimit: 256      # MB - memory limit for parser agent
    priority: 8           # High priority for parsing
    batchSize: 10         # Files per batch
    cacheSize: 104857600  # 100MB cache (in bytes)
    workerPoolSize: 2     # Number of worker threads

# Indexer Configuration
indexer:
  maxConcurrency: 2       # Database write operations
  memoryLimit: 512        # MB for graph operations
  priority: 7
  batchSize: 1000
  cacheSize: 52428800     # 50MB cache (in bytes)
  cacheTTL: 300000        # 5 minutes (in ms)

# Branch-Aware Indexing Configuration
# Enables per-branch databases for accurate indexing when switching Git branches
indexing:
  branchAware: false                # Enable per-branch databases (RECOMMENDED for Git repositories)
  autoSwitchOnBranchChange: true    # Automatically switch DB when Git branch changes
  maxBranchesPerRepo: 10            # Maximum branches to keep indexed per repository
  maxTotalBranches: 50              # Maximum total branches across all repositories
  evictionStrategy: "LRU"           # Options: LRU, LFU, FIFO - how to evict old branches
  cleanupIntervalMs: 3600000        # 1 hour - automatic cleanup interval
  incrementalThreshold: 20          # If >20 files changed, do full reindex instead of incremental
  dataDir: ""                         # Empty = use centralized storage (%LOCALAPPDATA%/UltraScriptTools/projects/<hash>/branches/)

# Git Integration Configuration
# Watches for Git branch changes and triggers automatic reindexing
git:
  enabled: false                    # Enable Git integration (requires Git to be installed)
  watchBranchChanges: true          # Watch .git/HEAD for branch switches
  autoReindex: true                 # Automatically reindex when branch changes detected
  diffMode: "incremental"           # Options: incremental, full - how to sync on branch switch
  pollIntervalMs: 5000              # 5 seconds - how often to check for new commits

# Dev Agent Configuration
devAgent:
  maxConcurrency: 3
  memoryLimit: 256
  priority: 7

# Dora Agent Configuration
doraAgent:
  maxConcurrency: 2
  memoryLimit: 128
  priority: 6

# Query Agent Configuration
queryAgent:
  maxConcurrency: 10
  memoryLimit: 112
  priority: 9
  simpleQueryTimeout: 100   # ms
  complexQueryTimeout: 1000  # ms
  cacheWarmupSize: 100

# Semantic Agent Configuration
semanticAgent:
  maxConcurrency: 5
  memoryLimit: 240
  priority: 8
  batchSize: 8
  modelPath: "./models"

# Coordinator Agent Configuration
coordinator:
  maxConcurrency: 100
  memoryLimit: 128
  priority: 10
  taskQueueLimit: 100
  loadBalancingStrategy: "least-loaded"
  resourceConstraints:
    maxMemoryMB: 1024
    maxCpuPercent: 80
    maxConcurrentAgents: 10
    maxTaskQueueSize: 100

# Conductor Orchestrator Configuration
conductor:
  maxConcurrency: 100
  memoryLimit: 128
  priority: 10
  taskQueueLimit: 100
  loadBalancingStrategy: "least-loaded"
  resourceConstraints:
    maxMemoryMB: 1024
    maxCpuPercent: 80
    maxConcurrentAgents: 10
    maxTaskQueueSize: 100
  complexityThreshold: 8
  mandatoryDelegation: true

# Performance Configuration
performance:
  monitoring:
    enabled: true
    collectMetrics: true
    metricsInterval: 60000  # 1 minute metrics collection interval
    
  optimization:
    enableVectorSearch: false  # Enable when sqlite-vec is available
    enableParallelParsing: true
    maxWorkerThreads: 4
    
# Development Features
development:
  enableHotReload: true
  verboseLogging: true
  enableDebugEndpoints: true
  mockExternalServices: false