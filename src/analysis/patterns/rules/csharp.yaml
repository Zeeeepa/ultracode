patterns:
  # Anti-patterns (migrated from chaos)
  - id: "cs:mutable-static"
    category: "anti-pattern"
    severity: "critical"
    name: "Mutable Static Field"
    description: "Mutable static field shared across all threads without protection"
    suggestion: "Use readonly, const, ThreadStatic, or ConcurrentDictionary"
    tags: ["state", "concurrency", "threading"]
    enabled: true
    structural:
      entityTypes: ["variable", "constant"]
      requiredModifiers: ["static"]
      forbiddenModifiers: ["readonly", "const"]
    customDetector: "checkMutableStatic"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.8

  - id: "cs:async-void"
    category: "anti-pattern"
    severity: "high"
    name: "Async Void Method"
    description: "async void method — exceptions crash the process, cannot be awaited"
    suggestion: "Change to async Task. async void is only for event handlers."
    tags: ["async", "error-handling"]
    enabled: true
    structural:
      entityTypes: ["method"]
      requiredModifiers: ["async"]
      returnTypeMatch: "^void$"
    customDetector: "checkCSharpAsyncVoid"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.9

  - id: "cs:god-service"
    category: "code-smell"
    severity: "medium"
    name: "God Service"
    description: "Constructor with 10+ parameters — likely violating SRP"
    suggestion: "Split into smaller services or use facade pattern"
    tags: ["architecture", "di", "srp"]
    enabled: true
    structural:
      entityTypes: ["method"]
      minParams: 10
    customDetector: "checkGodService"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "cs:missing-cancellation"
    category: "anti-pattern"
    severity: "medium"
    name: "Missing CancellationToken"
    description: "Async Task method without CancellationToken — cannot be cancelled gracefully"
    suggestion: "Add CancellationToken parameter and pass it to async calls"
    tags: ["async", "best-practice"]
    enabled: true
    structural:
      entityTypes: ["method"]
      requiredModifiers: ["async"]
      returnTypeMatch: "(Task|ValueTask)"
      paramTypeAbsent: "CancellationToken"
    customDetector: "checkMissingCancellation"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "cs:singleton-mutable-state"
    category: "anti-pattern"
    severity: "high"
    name: "Singleton Mutable State"
    description: "Singleton service with mutable fields — concurrent access causes data races"
    suggestion: "Use scoped services, immutable state, or thread-safe collections"
    tags: ["state", "concurrency", "di"]
    enabled: true
    structural:
      entityTypes: ["variable", "constant"]
      requiredModifiers: ["static"]
      forbiddenModifiers: ["readonly", "const"]
    customDetector: "checkSingletonMutableState"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "cs:string-concat-in-loop"
    category: "optimization"
    severity: "medium"
    name: "String Concatenation in Loop"
    description: "String += in loop creates new String on each iteration"
    suggestion: "Use StringBuilder with estimated capacity"
    bigO:
      before: "O(n^2)"
      after: "O(n)"
    benchmark: "10-100x faster for large strings"
    tags: ["performance", "memory", "strings"]
    enabled: true
    structural:
      entityTypes: ["method"]
      hasLoops: true
      hasStringConcatInLoop: true
    exemplarIds: ["cs:string-concat-loop:bad1"]
    minSemanticSimilarity: 0.6
    minStructuralConfidence: 0.5

  - id: "cs:empty-interface"
    category: "code-smell"
    severity: "low"
    name: "Empty Interface"
    description: "Interface without members and no base types — consider using attribute/marker instead"
    suggestion: "Use a custom attribute for marking or add meaningful members. Marker interfaces inheriting from base are OK."
    tags: ["architecture", "design"]
    enabled: true
    structural:
      entityTypes: ["interface"]
      maxLOC: 3
      hasNoInheritance: true
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  # Best patterns
  - id: "cs:proper-di"
    category: "best-pattern"
    severity: "info"
    name: "Proper Dependency Injection"
    description: "Constructor injection with interface parameters — testable and loosely coupled"
    suggestion: "Good pattern! Continue using constructor injection with interfaces."
    tags: ["architecture", "di", "testability"]
    enabled: true
    structural:
      entityTypes: ["method"]
      minParams: 2
      paramTypeRequired: "^I[A-Z]"
    exemplarIds: ["cs:proper-di:good1"]
    minSemanticSimilarity: 0.55
    minStructuralConfidence: 0.6

  - id: "cs:cancellation-propagation"
    category: "best-pattern"
    severity: "info"
    name: "Cancellation Token Propagation"
    description: "Async method properly accepts and propagates CancellationToken"
    suggestion: "Good pattern! Proper cancellation support enables graceful shutdown."
    tags: ["async", "best-practice"]
    enabled: true
    structural:
      entityTypes: ["method"]
      requiredModifiers: ["async"]
      paramTypeRequired: "CancellationToken"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  # Optimization
  - id: "cs:linq-in-hotpath"
    category: "optimization"
    severity: "medium"
    name: "LINQ in Hot Path"
    description: "LINQ chain in loops or hot paths creates allocations (iterators, delegates)"
    suggestion: "Replace with manual foreach/for loop. Avoids LINQ allocations."
    bigO:
      before: "O(n) + allocs"
      after: "O(n) zero-alloc"
    benchmark: "2-5x faster in hot paths, eliminates GC pressure"
    tags: ["performance", "memory", "dotnet"]
    enabled: true
    structural:
      entityTypes: ["method"]
    customDetector: "checkLinqInHotpath"
    exemplarIds: ["cs:linq-hotpath:bad1"]
    minSemanticSimilarity: 0.6
    minStructuralConfidence: 0.5

  - id: "cs:no-asnotracking"
    category: "optimization"
    severity: "medium"
    name: "EF Query Without AsNoTracking"
    description: "Read-only EF Core query without AsNoTracking — unnecessary change tracking overhead"
    suggestion: "Add .AsNoTracking() for read-only queries or use AsNoTrackingWithIdentityResolution"
    benchmark: "20-40% faster for read-only queries"
    tags: ["performance", "ef-core", "database"]
    enabled: true
    structural:
      entityTypes: ["method"]
      callsInclude: ["DbContext|DbSet|\\.ToList|\\.FirstOrDefault|\\.SingleOrDefault|\\.Where"]
      callsExclude: ["AsNoTracking"]
    exemplarIds: ["cs:no-asnotracking:bad1"]
    minSemanticSimilarity: 0.65
    minStructuralConfidence: 0.4

  - id: "cs:no-arraypool"
    category: "optimization"
    severity: "medium"
    name: "Temporary Buffer Without ArrayPool"
    description: "new byte[size] for temporary buffers — causes GC pressure"
    suggestion: "Use ArrayPool<byte>.Shared.Rent(size) and return after use"
    benchmark: "850x faster for frequent allocations"
    tags: ["performance", "memory", "dotnet"]
    enabled: true
    structural:
      entityTypes: ["method"]
      callsInclude: ["new byte\\[|new Byte\\["]
      callsExclude: ["ArrayPool"]
    exemplarIds: ["cs:no-arraypool:bad1"]
    minSemanticSimilarity: 0.65
    minStructuralConfidence: 0.5

  - id: "cs:string-interpolation-in-log"
    category: "optimization"
    severity: "low"
    name: "String Interpolation in Logger"
    description: "Logger.LogDebug($\"...\") allocates string even when log level is disabled"
    suggestion: "Use structured logging: _logger.LogDebug(\"User {Id} logged in\", userId)"
    benchmark: "Eliminates unnecessary string allocation when level disabled"
    tags: ["performance", "logging", "dotnet"]
    enabled: true
    structural:
      entityTypes: ["method"]
      callsInclude: ["Log(Debug|Information|Warning|Error|Trace|Critical)"]
    exemplarIds: ["cs:string-interp-log:bad1"]
    minSemanticSimilarity: 0.65
    minStructuralConfidence: 0.5

  - id: "cs:ef-n-plus-one"
    category: "optimization"
    severity: "high"
    name: "EF Core N+1 Query"
    description: "Accessing navigation property in loop triggers N additional queries"
    suggestion: "Use .Include() or .ThenInclude() for eager loading"
    bigO:
      before: "O(N+1) queries"
      after: "O(1) query"
    benchmark: "10-100x faster for collections"
    tags: ["performance", "ef-core", "database"]
    enabled: true
    structural:
      entityTypes: ["method"]
      hasLoops: true
      callsInclude: ["DbContext|DbSet|\\.Include|\\.Where|\\.Select|\\.FirstOrDefault"]
      callsExclude: ["\\.Include\\("]
    exemplarIds: ["cs:ef-n-plus-one:bad1"]
    minSemanticSimilarity: 0.65
    minStructuralConfidence: 0.5

  # ── Wave 1: EF Core ──────────────────────────────────────────────

  - id: "cs:ef-dbcontext-singleton"
    category: "anti-pattern"
    severity: "critical"
    name: "DbContext Registered as Singleton"
    description: "DbContext is not thread-safe; singleton registration causes data corruption and concurrency bugs"
    suggestion: "Use AddDbContext or AddScoped instead of AddSingleton for DbContext"
    tags: ["ef-core", "di", "concurrency"]
    enabled: true
    structural:
      entityTypes: ["method"]
      callsInclude: ["AddSingleton.*DbContext|AddSingleton<.*DbContext"]
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.8

  - id: "cs:ef-cartesian-explosion"
    category: "anti-pattern"
    severity: "medium"
    name: "EF Core Cartesian Explosion"
    description: "Multiple Include() without AsSplitQuery causes cartesian product explosion"
    suggestion: "Add .AsSplitQuery() or restructure into separate queries"
    tags: ["ef-core", "performance", "database"]
    enabled: true
    structural:
      entityTypes: ["method"]
    customDetector: "checkEfCartesianExplosion"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "cs:ef-load-entire-table"
    category: "anti-pattern"
    severity: "critical"
    name: "EF Core Load Entire Table"
    description: "ToList/ToArray on DbSet without Where/Take/Skip loads entire table into memory"
    suggestion: "Add filtering (Where), pagination (Take/Skip), or projection (Select) before materializing"
    tags: ["ef-core", "performance", "memory"]
    enabled: true
    structural:
      entityTypes: ["method"]
    customDetector: "checkEfLoadEntireTable"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.8

  - id: "cs:ef-entity-as-api-response"
    category: "anti-pattern"
    severity: "medium"
    name: "EF Entity Exposed in API Response"
    description: "Returning EF entity directly from API endpoint leaks internal schema and navigation properties"
    suggestion: "Map to a DTO/ViewModel before returning from the endpoint"
    tags: ["ef-core", "api", "security"]
    enabled: true
    structural:
      entityTypes: ["method"]
      decoratorMatch: ["Http(Get|Post|Put|Delete|Patch)"]
    customDetector: "checkEfEntityAsApiResponse"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.6

  # ── Wave 1: Async ────────────────────────────────────────────────

  - id: "cs:async-sync-over-async"
    category: "anti-pattern"
    severity: "critical"
    name: "Sync-over-Async (.Result / .Wait())"
    description: "Blocking on async code with .Result or .Wait() causes deadlocks in ASP.NET and UI apps"
    suggestion: "Use await instead of .Result/.Wait(). Propagate async all the way up."
    tags: ["async", "deadlock", "performance"]
    enabled: true
    structural:
      entityTypes: ["method"]
      minSyncOverAsync: 1
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.9

  - id: "cs:async-fire-and-forget"
    category: "anti-pattern"
    severity: "medium"
    name: "Fire-and-Forget Async Call"
    description: "Calling async method without await — exceptions are silently swallowed"
    suggestion: "Await the Task, or use a background task queue (IHostedService)"
    tags: ["async", "error-handling"]
    enabled: true
    structural:
      entityTypes: ["method"]
    customDetector: "checkAsyncFireAndForget"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "cs:async-task-run-in-aspnet"
    category: "anti-pattern"
    severity: "medium"
    name: "Task.Run in ASP.NET Controller/Handler"
    description: "Task.Run in ASP.NET wastes thread pool threads — ASP.NET is already async"
    suggestion: "Use async/await directly instead of Task.Run in web request handlers"
    tags: ["async", "aspnet", "performance"]
    enabled: true
    structural:
      entityTypes: ["method"]
      callsInclude: ["Task\\.Run"]
    customDetector: "checkTaskRunInAspnet"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  # ── Wave 1: DI ───────────────────────────────────────────────────

  - id: "cs:di-service-locator"
    category: "anti-pattern"
    severity: "medium"
    name: "Service Locator Anti-Pattern"
    description: "Calling GetService/GetRequiredService outside DI registration hides dependencies"
    suggestion: "Use constructor injection instead of resolving from IServiceProvider"
    tags: ["di", "architecture", "testability"]
    enabled: true
    structural:
      entityTypes: ["method"]
      callsInclude: ["GetService|GetRequiredService"]
    customDetector: "checkDiServiceLocator"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "cs:di-too-many-deps"
    category: "code-smell"
    severity: "low"
    name: "Too Many Constructor Dependencies"
    description: "Constructor with more than 5 non-infrastructure dependencies — violates SRP"
    suggestion: "Apply facade pattern or split the service into focused smaller services"
    tags: ["di", "architecture", "srp"]
    enabled: true
    structural:
      entityTypes: ["method"]
      minParams: 6
    customDetector: "checkDiTooManyDeps"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.6

  # ── Wave 1: Memory ───────────────────────────────────────────────

  - id: "cs:mem-httpclient-new"
    category: "anti-pattern"
    severity: "critical"
    name: "new HttpClient() — Socket Exhaustion"
    description: "Creating new HttpClient per request causes socket exhaustion (TIME_WAIT)"
    suggestion: "Use IHttpClientFactory or a static/singleton HttpClient"
    tags: ["memory", "network", "performance"]
    enabled: true
    structural:
      entityTypes: ["method"]
      hasNewHttpClient: true
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.9

  - id: "cs:mem-static-collection-leak"
    category: "anti-pattern"
    severity: "medium"
    name: "Static Collection Memory Leak"
    description: "Static List/Dictionary that grows but never clears — unbounded memory growth"
    suggestion: "Use ConcurrentDictionary with eviction, or bounded collection with size limit"
    tags: ["memory", "static", "leak"]
    enabled: true
    structural:
      entityTypes: ["method"]
    customDetector: "checkStaticCollectionLeak"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  # ── Wave 1: Concurrency ──────────────────────────────────────────

  - id: "cs:conc-lock-on-this"
    category: "anti-pattern"
    severity: "critical"
    name: "lock(this) or lock(typeof(...))"
    description: "Locking on publicly accessible objects allows external code to cause deadlocks"
    suggestion: "Use a private readonly object field: private readonly object _lock = new();"
    tags: ["concurrency", "deadlock", "threading"]
    enabled: true
    structural:
      entityTypes: ["method"]
      hasLockOnThis: true
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.9

  # ── Wave 1: Error Handling ───────────────────────────────────────

  - id: "cs:err-swallowed-exception"
    category: "anti-pattern"
    severity: "critical"
    name: "Swallowed Exception (Empty Catch)"
    description: "Empty catch block silently swallows exceptions — hides bugs and failures"
    suggestion: "Log the exception, rethrow, or handle specifically. Never ignore exceptions."
    tags: ["error-handling", "reliability"]
    enabled: true
    structural:
      entityTypes: ["method"]
      minEmptyCatch: 1
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.9

  - id: "cs:err-throw-ex"
    category: "anti-pattern"
    severity: "high"
    name: "throw ex — Stack Trace Lost"
    description: "'throw ex' resets the stack trace, making debugging impossible"
    suggestion: "Use 'throw;' (without variable) to preserve the original stack trace"
    tags: ["error-handling", "debugging"]
    enabled: true
    structural:
      entityTypes: ["method"]
      minThrowEx: 1
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.9

  # ── Wave 1: Security ─────────────────────────────────────────────

  - id: "cs:aspnet-wildcard-cors"
    category: "anti-pattern"
    severity: "critical"
    name: "Wildcard CORS (AllowAnyOrigin)"
    description: "AllowAnyOrigin disables CORS protection — any site can make requests to your API"
    suggestion: "Specify allowed origins explicitly with WithOrigins(\"https://example.com\")"
    tags: ["security", "cors", "aspnet"]
    enabled: true
    structural:
      entityTypes: ["method"]
      callsInclude: ["AllowAnyOrigin"]
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.9

  - id: "cs:aspnet-pii-in-logs"
    category: "anti-pattern"
    severity: "high"
    name: "PII Object Destructuring in Logs"
    description: "Using {@Object} destructuring in logs exposes entire objects including PII"
    suggestion: "Log specific fields instead of destructuring entire objects: Log(\"{Name}\", user.Name)"
    tags: ["security", "logging", "pii"]
    enabled: true
    structural:
      entityTypes: ["method"]
    customDetector: "checkPiiInLogs"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  # ── Wave 1: Minimal API ──────────────────────────────────────────

  - id: "cs:minimal-api-no-validation"
    category: "anti-pattern"
    severity: "medium"
    name: "Minimal API Endpoint Without Validation"
    description: "Endpoint handler accepting complex input without validation — allows invalid data"
    suggestion: "Add FluentValidation, MiniValidation, or manual validation for input DTOs"
    tags: ["minimal-api", "validation", "aspnet"]
    enabled: true
    structural:
      entityTypes: ["method"]
    customDetector: "checkMinimalApiNoValidation"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.6

  - id: "cs:minimal-api-results-not-typed"
    category: "code-smell"
    severity: "low"
    name: "Minimal API Using Results Instead of TypedResults"
    description: "Results.Ok() doesn't include type info in OpenAPI — use TypedResults for proper docs"
    suggestion: "Replace Results.Ok() with TypedResults.Ok() for OpenAPI/Swagger metadata"
    tags: ["minimal-api", "openapi", "aspnet"]
    enabled: true
    structural:
      entityTypes: ["method"]
      callsInclude: ["Results\\.(Ok|NotFound|BadRequest|Created|NoContent)"]
      callsExclude: ["TypedResults"]
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "cs:minimal-api-fat-lambda"
    category: "code-smell"
    severity: "medium"
    name: "Fat Lambda in Minimal API Endpoint"
    description: "Inline endpoint handler with high complexity — hard to test and maintain"
    suggestion: "Extract handler logic to a named method or a dedicated handler class"
    tags: ["minimal-api", "architecture", "testability"]
    enabled: true
    structural:
      entityTypes: ["method"]
      minLOC: 20
      minCyclomatic: 4
    customDetector: "checkMinimalApiFatLambda"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.6

  # ── Wave 1: gRPC ─────────────────────────────────────────────────

  - id: "cs:grpc-missing-deadline"
    category: "anti-pattern"
    severity: "medium"
    name: "gRPC Call Without Deadline"
    description: "gRPC call without deadline can hang indefinitely if server is unresponsive"
    suggestion: "Set CallOptions with deadline: new CallOptions(deadline: DateTime.UtcNow.AddSeconds(30))"
    tags: ["grpc", "reliability", "timeout"]
    enabled: true
    structural:
      entityTypes: ["method"]
    customDetector: "checkGrpcMissingDeadline"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.6

  - id: "cs:grpc-channel-per-call"
    category: "anti-pattern"
    severity: "critical"
    name: "New gRPC Channel Per Call"
    description: "Creating GrpcChannel per request wastes connections — channels should be reused"
    suggestion: "Register GrpcChannel as singleton in DI: services.AddSingleton(GrpcChannel.ForAddress(...))"
    tags: ["grpc", "performance", "network"]
    enabled: true
    structural:
      entityTypes: ["method"]
    customDetector: "checkGrpcChannelPerCall"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.8

  # ── Wave 2: Async (controlFlow-dependent) ──────────────────────

  - id: "cs:async-lock-with-await"
    category: "anti-pattern"
    severity: "critical"
    name: "lock() with await Inside"
    description: "lock/Monitor with await inside — lock is released during await, allowing concurrent access"
    suggestion: "Replace lock with SemaphoreSlim(1,1) and use await semaphore.WaitAsync()"
    tags: ["async", "concurrency", "deadlock"]
    enabled: true
    structural:
      entityTypes: ["method"]
      hasAwaits: true
    customDetector: "checkAsyncLockWithAwait"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.8

  - id: "cs:async-parallel-foreach-async"
    category: "anti-pattern"
    severity: "high"
    name: "Parallel.ForEach with Async Delegate"
    description: "Parallel.ForEach with async lambda creates fire-and-forget tasks — use Parallel.ForEachAsync"
    suggestion: "Replace with await Parallel.ForEachAsync() (available since .NET 6)"
    tags: ["async", "concurrency", "correctness"]
    enabled: true
    structural:
      entityTypes: ["method"]
      hasParallelForEachAsync: true
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.9

  # ── Wave 2: EF Core (controlFlow-dependent) ───────────────────

  - id: "cs:ef-find-in-loop"
    category: "anti-pattern"
    severity: "high"
    name: "EF Query Inside Loop"
    description: "Database query inside loop body causes N+1 round-trips to the database"
    suggestion: "Fetch all needed data before the loop with .Include() or batch query"
    bigO:
      before: "O(N) queries"
      after: "O(1) query"
    tags: ["ef-core", "performance", "database"]
    enabled: true
    structural:
      entityTypes: ["method"]
      hasLoops: true
    customDetector: "checkEfFindInLoop"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "cs:ef-client-side-eval"
    category: "anti-pattern"
    severity: "high"
    name: "EF Core Client-Side Evaluation"
    description: "AsEnumerable()/ToList() before LINQ forces client-side evaluation — loads entire table"
    suggestion: "Keep LINQ operators before materialization to execute them on the database"
    tags: ["ef-core", "performance", "database"]
    enabled: true
    structural:
      entityTypes: ["method"]
      callsInclude: ["AsEnumerable|ToList|ToArray"]
    customDetector: "checkEfClientSideEval"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "cs:ef-savechanges-no-transaction"
    category: "anti-pattern"
    severity: "medium"
    name: "Multiple SaveChanges Without Transaction"
    description: "Multiple SaveChanges calls without explicit transaction — partial commit on failure"
    suggestion: "Wrap in using var tx = await _context.Database.BeginTransactionAsync()"
    tags: ["ef-core", "database", "reliability"]
    enabled: true
    structural:
      entityTypes: ["method"]
      callsInclude: ["SaveChanges|SaveChangesAsync"]
    customDetector: "checkEfSaveChangesNoTransaction"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  # ── Wave 2: Error Handling ─────────────────────────────────────

  - id: "cs:err-catch-generic"
    category: "anti-pattern"
    severity: "medium"
    name: "catch(Exception) Without Specific Catches"
    description: "Catching base Exception without specific catches hides the actual error type"
    suggestion: "Catch specific exceptions first (IOException, ArgumentException, etc.), then Exception as fallback"
    tags: ["error-handling", "reliability"]
    enabled: true
    structural:
      entityTypes: ["method"]
      hasExceptions: true
    customDetector: "checkCatchGeneric"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "cs:err-exception-flow-control"
    category: "anti-pattern"
    severity: "medium"
    name: "Exception as Flow Control"
    description: "try/catch inside loop uses exceptions for flow control — expensive and hard to debug"
    suggestion: "Use conditional checks (TryParse, TryGetValue, null checks) instead of catching exceptions"
    tags: ["error-handling", "performance"]
    enabled: true
    structural:
      entityTypes: ["method"]
      hasLoops: true
      hasExceptions: true
    customDetector: "checkExceptionFlowControl"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  # ── Wave 2: Memory ─────────────────────────────────────────────

  - id: "cs:mem-missing-dispose"
    category: "anti-pattern"
    severity: "high"
    name: "IDisposable Created Without using/Dispose"
    description: "IDisposable object created without using statement — resource leak (file handles, connections)"
    suggestion: "Wrap in using statement: using var stream = new FileStream(...)"
    tags: ["memory", "resource-leak", "reliability"]
    enabled: true
    structural:
      entityTypes: ["method"]
      hasNewDisposableNoUsing: true
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.8

