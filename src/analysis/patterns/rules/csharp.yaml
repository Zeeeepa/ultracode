    severity: "high"
    name: "Dapper Query Inside Loop (N+1)"
    description: "Dapper query executed inside a loop — sends N separate SQL queries instead of one batch query"
    suggestion: "Fetch all data with WHERE IN (@ids) before the loop, or use QueryMultiple for batch loading"
    bigO:
      before: "O(N) round-trips"
      after: "O(1) round-trip"
    benchmark: "10-100x faster, eliminates N network round-trips"
    tags: ["performance", "database", "dapper"]
    enabled: true
    structural:
      entityTypes: ["method"]
      hasLoops: true
      callsInclude: ["Query|QueryAsync|QueryFirst|QueryFirstOrDefault|QuerySingle|QuerySingleOrDefault|Execute|ExecuteAsync"]
    customDetector: "checkDapperNPlusOne"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "cs:dapper-no-commandtimeout"
    category: "code-smell"
