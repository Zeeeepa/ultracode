  # ── Wave 4: Dapper ──────────────────────────────────────────────

  - id: "cs:dapper-implicit-nvarchar"
    category: "optimization"
    severity: "high"
    name: "Dapper Implicit nvarchar(4000) Conversion"
    description: "String params via anonymous objects become nvarchar(4000). If DB column is varchar, SQL Server performs CONVERT_IMPLICIT on every index row — Index Seek degrades to Index Scan"
    suggestion: "Use DynamicParameters with DbType.AnsiString for varchar columns, or new DbString { Value = x, IsAnsi = true, Length = N }"
    bigO:
      before: "Index Scan O(N)"
      after: "Index Seek O(log N)"
    benchmark: "10-1000x faster on large tables with varchar indexes"
    tags: ["performance", "database", "dapper", "sql-server"]
    enabled: true
    structural:
      entityTypes: ["method"]
      callsInclude: ["Query|QueryAsync|QueryFirst|QueryFirstOrDefault|QuerySingle|QuerySingleOrDefault|Execute|ExecuteAsync|ExecuteScalar|ExecuteScalarAsync|QueryMultiple|QueryMultipleAsync"]
      callsExclude: ["DynamicParameters|DbString|DbType"]
    customDetector: "checkDapperImplicitNvarchar"
    exemplarIds: ["cs:dapper-nvarchar:bad1"]
    minSemanticSimilarity: 0.55
    minStructuralConfidence: 0.5

  - id: "cs:dapper-query-then-first"
    category: "anti-pattern"
    severity: "high"
    name: "Dapper Query().First() — Fetches All Rows"
    description: "Query<T>() loads ALL rows into List<T> (buffered=true by default), then LINQ takes first. On large tables causes massive memory allocation and network traffic"
    suggestion: "Use QueryFirstOrDefault<T>() / QuerySingleOrDefault<T>() — reads only one row from the server"
    bigO:
      before: "O(N) rows fetched + O(N) memory"
      after: "O(1) row fetched"
    benchmark: "100-10000x less memory on large tables"
    tags: ["performance", "database", "dapper", "memory"]
    enabled: true
    structural:
      entityTypes: ["method"]
      callsInclude: ["Query|QueryAsync"]
    customDetector: "checkDapperQueryThenFirst"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

