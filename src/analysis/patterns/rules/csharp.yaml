    category: "anti-pattern"
    severity: "critical"
    name: "SQL Injection via Dapper String Interpolation"
    description: "String interpolation ($\"\") or concatenation (+) in SQL passed to Dapper — Dapper does NOT parameterize raw strings, unlike EF FromSqlInterpolated"
    suggestion: "Use @param placeholders in SQL and pass values via anonymous object or DynamicParameters"
    tags: ["security", "injection", "dapper", "database"]
    enabled: true
    structural:
      entityTypes: ["method"]
      callsInclude: ["Query|QueryAsync|QueryFirst|QueryFirstOrDefault|QuerySingle|QuerySingleOrDefault|Execute|ExecuteAsync|ExecuteScalar|ExecuteScalarAsync|QueryMultiple|QueryMultipleAsync"]
    customDetector: "checkDapperSqlInjection"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.9

  - id: "cs:dapper-n-plus-one"
