    category: "optimization"
    severity: "medium"
    name: "Dapper Buffered Query for Bulk/Export Operations"
    description: "Query<T>() with buffered=true (default) in bulk/export/report methods — loads entire result set into memory"
    suggestion: "Pass buffered: false for large result sets: Query<T>(sql, param, buffered: false). Process rows as IEnumerable<T> stream"
