patterns:
  # Anti-patterns
  - id: "go:ignored-error"
    category: "anti-pattern"
    severity: "high"
    name: "Ignored Error"
    description: "Function call with error return that is not checked"
    suggestion: "Always check errors: if err != nil { return fmt.Errorf(..., err) }"
    tags: ["error-handling"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
    customDetector: "checkIgnoredError"
    exemplarIds: ["go:ignored-error:bad1"]
    minSemanticSimilarity: 0.55
    minStructuralConfidence: 0.5

  - id: "go:goroutine-leak"
    category: "anti-pattern"
    severity: "high"
    name: "Goroutine Leak"
    description: "Goroutine launched without context — cannot be cancelled, may leak"
    suggestion: "Pass context.Context and select on ctx.Done() to enable cancellation"
    tags: ["concurrency", "memory"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
    customDetector: "checkGoroutineLeak"
    exemplarIds: ["go:goroutine-leak:bad1"]
    minSemanticSimilarity: 0.6
    minStructuralConfidence: 0.5

  - id: "go:naked-return"
    category: "code-smell"
    severity: "low"
    name: "Naked Return in Long Function"
    description: "Naked return in function >10 lines — reduces readability"
    suggestion: "Use explicit return values for clarity in longer functions"
    tags: ["readability"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      minLOC: 10
    customDetector: "checkNakedReturn"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.5

  - id: "go:too-many-returns"
    category: "code-smell"
    severity: "medium"
    name: "Too Many Return Statements"
    description: "Function with >5 return statements — complex control flow"
    suggestion: "Simplify logic or extract into helper functions"
    tags: ["complexity", "readability"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
    customDetector: "checkTooManyReturns"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.5

  # Best patterns
  - id: "go:error-wrapping"
    category: "best-pattern"
    severity: "info"
    name: "Error Wrapping"
    description: "Using fmt.Errorf with %w for error wrapping — preserves error chain"
    suggestion: "Good pattern! Error wrapping enables errors.Is/As checks."
    tags: ["error-handling", "quality"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      hasExceptions: true
    exemplarIds: ["go:error-wrapping:good1"]
    minSemanticSimilarity: 0.6
    minStructuralConfidence: 0.4

  - id: "go:context-propagation"
    category: "best-pattern"
    severity: "info"
    name: "Context Propagation"
    description: "Function accepts context.Context as first parameter — enables cancellation and deadlines"
    suggestion: "Good pattern! Context propagation enables graceful cancellation."
    tags: ["concurrency", "best-practice"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      paramTypeRequired: "Context"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "go:interface-segregation"
    category: "best-pattern"
    severity: "info"
    name: "Small Interface"
    description: "Interface with 1-3 methods — follows Go idiom of small interfaces"
    suggestion: "Good pattern! Small interfaces are easier to implement and mock."
    tags: ["architecture", "quality"]
    enabled: true
    structural:
      entityTypes: ["interface"]
      maxLOC: 10
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.6

  # Optimization
  - id: "go:string-concat-in-loop"
    category: "optimization"
    severity: "medium"
    name: "String Concatenation in Loop"
    description: "String += in loop creates new string on each iteration"
    suggestion: "Use strings.Builder or bytes.Buffer"
    bigO:
      before: "O(n^2)"
      after: "O(n)"
    benchmark: "10-100x faster for large strings"
    tags: ["performance", "memory", "strings"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      hasLoops: true
    exemplarIds: ["go:string-concat-loop:bad1"]
    minSemanticSimilarity: 0.65
    minStructuralConfidence: 0.5

  - id: "go:slice-no-capacity"
    category: "optimization"
    severity: "low"
    name: "Slice Without Pre-allocation"
    description: "Growing slice without make([]T, 0, cap) causes repeated reallocations"
    suggestion: "Pre-allocate: make([]T, 0, expectedSize)"
    benchmark: "Reduces allocations and GC pressure"
    tags: ["performance", "memory"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      hasLoops: true
    exemplarIds: ["go:slice-no-cap:bad1"]
    minSemanticSimilarity: 0.6
    minStructuralConfidence: 0.4
