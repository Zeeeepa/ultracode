patterns:
  # Anti-patterns
  - id: "ts:async-void"
    category: "anti-pattern"
    severity: "high"
    name: "Async Void Function"
    description: "async void function — exceptions cannot be caught by the caller"
    suggestion: "Change return type to Promise<void> to allow proper error handling"
    tags: ["async", "error-handling"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      requiredModifiers: ["async"]
      returnTypeMatch: "^(void|undefined)$"
    customDetector: "checkAsyncVoid"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.8

  - id: "ts:empty-catch"
    category: "anti-pattern"
    severity: "high"
    name: "Empty Catch Block"
    description: "catch block without error handling silently swallows exceptions"
    suggestion: "Add logging or rethrow the error. Use typed catch blocks."
    tags: ["error-handling"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      hasExceptions: true
    customDetector: "checkEmptyCatch"
    exemplarIds: ["ts:empty-catch:bad1"]
    minSemanticSimilarity: 0.55
    minStructuralConfidence: 0.6

  - id: "ts:nested-callbacks"
    category: "anti-pattern"
    severity: "medium"
    name: "Nested Callbacks (Callback Hell)"
    description: "Deep nesting without async/await — hard to follow and maintain"
    suggestion: "Refactor to async/await or extract nested logic into named functions"
    tags: ["async", "readability"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      minNesting: 4
    customDetector: "checkNestedCallbacks"
    exemplarIds: ["ts:nested-callbacks:bad1"]
    minSemanticSimilarity: 0.55
    minStructuralConfidence: 0.6

  - id: "ts:any-type-param"
    category: "anti-pattern"
    severity: "medium"
    name: "Any Type Parameter"
    description: "'any' type in parameters bypasses TypeScript type checking"
    suggestion: "Use specific types, generics, or 'unknown' with type guards"
    tags: ["type-safety"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
    customDetector: "checkAnyTypeParam"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "ts:promise-no-catch"
    category: "anti-pattern"
    severity: "high"
    name: "Promise Without Error Handling"
    description: "Promise chain without .catch() or try/catch — unhandled rejection"
    suggestion: "Add .catch() handler or wrap in try/catch with await"
    tags: ["async", "error-handling"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
    customDetector: "checkPromiseNoCatch"
    exemplarIds: ["ts:promise-no-catch:bad1"]
    minSemanticSimilarity: 0.6
    minStructuralConfidence: 0.5

  - id: "ts:mutable-export"
    category: "anti-pattern"
    severity: "medium"
    name: "Mutable Export"
    description: "Exported mutable variable — consumers can modify shared state unexpectedly"
    suggestion: "Use 'export const' or export a function that returns the value"
    tags: ["state", "architecture"]
    enabled: true
    structural:
      entityTypes: ["variable"]
      requiredModifiers: ["export"]
      forbiddenModifiers: ["const", "readonly"]
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.8

  - id: "ts:no-error-typing"
    category: "anti-pattern"
    severity: "low"
    name: "Untyped Error in Catch"
    description: "catch(e) without typing the error — unknown type at runtime"
    suggestion: "Use catch(e: unknown) and narrow with instanceof checks"
    tags: ["error-handling", "type-safety"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      hasExceptions: true
    exemplarIds: ["ts:no-error-typing:bad1"]
    minSemanticSimilarity: 0.6
    minStructuralConfidence: 0.5

  # Best patterns
  - id: "ts:proper-error-handling"
    category: "best-pattern"
    severity: "info"
    name: "Proper Async Error Handling"
    description: "Async function with proper try/catch — errors are handled gracefully"
    suggestion: "Good pattern! Continue using structured error handling in async code."
    tags: ["async", "error-handling"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      requiredModifiers: ["async"]
      hasExceptions: true
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "ts:proper-async-await"
    category: "best-pattern"
    severity: "info"
    name: "Proper Async/Await Usage"
    description: "Well-structured async function with await and error handling"
    suggestion: "Good pattern! Async/await with proper error handling is the way to go."
    tags: ["async", "quality"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      requiredModifiers: ["async"]
      hasAwaits: true
      hasExceptions: true
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  # Optimization
  - id: "ts:layout-thrashing"
    category: "optimization"
    severity: "medium"
    name: "Layout Thrashing"
    description: "Interleaved DOM read/write operations force browser to recalculate layout repeatedly"
    suggestion: "Batch all reads first, then all writes. Use requestAnimationFrame or DocumentFragment."
    bigO:
      before: "O(n*layout)"
      after: "O(1*layout)"
    benchmark: "10-100x faster for DOM-heavy updates"
    tags: ["performance", "dom", "frontend"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      minCallCount: 3
      callsInclude: ["(offset|client|scroll|getBounding)(Width|Height|Top|Left|Rect)", "style|className|setAttribute|innerHTML|appendChild|removeChild"]
    exemplarIds: ["ts:layout-thrashing:bad1"]
    minSemanticSimilarity: 0.6
    minStructuralConfidence: 0.5

  - id: "ts:angular-default-change-detection"
    category: "optimization"
    severity: "medium"
    name: "Default Change Detection in Angular"
    description: "Missing OnPush change detection — Angular checks all bindings on every event"
    suggestion: "Use ChangeDetectionStrategy.OnPush with signals or observables"
    benchmark: "50-90% fewer change detection cycles"
    tags: ["performance", "angular", "frontend"]
    enabled: true
    structural:
      entityTypes: ["class"]
      decoratorMatch: ["Component"]
    exemplarIds: ["ts:angular-default-cd:bad1"]
    minSemanticSimilarity: 0.6
    minStructuralConfidence: 0.5

  - id: "ts:rxjs-subscribe-in-loop"
    category: "optimization"
    severity: "high"
    name: "Subscribe in Loop Without Unsubscribe"
    description: "Creating subscriptions in loops without cleanup causes memory leaks"
    suggestion: "Use takeUntil, async pipe, or merge/forkJoin to manage subscriptions"
    tags: ["performance", "memory", "rxjs"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      hasLoops: true
      callsInclude: ["subscribe"]
    exemplarIds: ["ts:rxjs-subscribe-loop:bad1"]
    minSemanticSimilarity: 0.65
    minStructuralConfidence: 0.5

  - id: "ts:no-trackby-ngfor"
    category: "optimization"
    severity: "medium"
    name: "ngFor Without trackBy"
    description: "ngFor without trackBy destroys and recreates all DOM elements on change"
    suggestion: "Add trackBy function to ngFor to enable efficient DOM updates"
    benchmark: "5-20x faster list re-renders"
    tags: ["performance", "angular", "dom"]
    enabled: true
    structural:
      entityTypes: ["class"]
      decoratorMatch: ["Component"]
    exemplarIds: ["ts:no-trackby:bad1"]
    minSemanticSimilarity: 0.6
    minStructuralConfidence: 0.4

  - id: "ts:function-in-template"
    category: "optimization"
    severity: "medium"
    name: "Function Call in Template"
    description: "Function called in Angular template runs on every change detection cycle"
    suggestion: "Use a pipe or computed signal instead of function calls in templates"
    benchmark: "Eliminates redundant recalculations per CD cycle"
    tags: ["performance", "angular", "frontend"]
    enabled: true
    structural:
      entityTypes: ["method"]
      maxLOC: 10
      maxCyclomatic: 2
      nameNotMatch: "^(ng|constructor|init|destroy|track)"
    exemplarIds: ["ts:function-in-template:bad1"]
    minSemanticSimilarity: 0.65
    minStructuralConfidence: 0.5

  # ─── JIT Optimization ───────────────────────────────────────

  - id: "ts:jit-eval"
    category: "optimization"
    severity: "critical"
    name: "eval() Prevents JIT Optimization"
    description: "eval() forces the engine to abandon all speculative optimizations in the containing function"
    suggestion: "Replace with Function constructor, JSON.parse(), or Map-based dispatch"
    benchmark: "2-100x slower — entire function stays in interpreter"
    tags: ["jit", "performance"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      callsInclude: ["\\.eval$"]
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.9

  - id: "ts:jit-holey-array"
    category: "optimization"
    severity: "medium"
    name: "Holey Array via new Array(n)"
    description: "new Array(n) creates a HOLEY array that never becomes PACKED — each access requires prototype chain lookup"
    suggestion: "Use Array.from({length: n}, (_, i) => i) or [] with .push() to keep PACKED element kind"
    benchmark: "Up to 6x slower element access on holey vs packed arrays"
    tags: ["jit", "performance"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      callsInclude: ["Array"]
    customDetector: "checkHoleyArray"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.8

  - id: "ts:jit-delete-operator"
    category: "optimization"
    severity: "high"
    name: "delete Operator Kills Inline Caching"
    description: "delete transitions object to dictionary mode permanently — inline caching disabled for that object"
    suggestion: "Set property to undefined instead: obj.prop = undefined. Use Map for dynamic key-value storage"
    benchmark: "35-40% throughput loss measured in production Node.js services"
    tags: ["jit", "performance"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      hasDeleteExpression: true
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.9

  - id: "ts:jit-arguments-object"
    category: "optimization"
    severity: "medium"
    name: "arguments Object Prevents Optimization"
    description: "The arguments object prevents V8 from applying key optimizations — function stays in slower execution tier"
    suggestion: "Use rest parameters (...args) instead of arguments object"
    tags: ["jit", "performance"]
    enabled: true
    structural:
      entityTypes: ["method", "function"]
      hasArgumentsReference: true
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.9

  - id: "ts:jit-with-statement"
    category: "optimization"
    severity: "critical"
    name: "with Statement Deoptimizes Scope Chain"
    description: "with completely prevents scope chain optimization — the engine cannot statically resolve any variable in scope"
    suggestion: "Remove with statement entirely. Use destructuring or local variables"
    tags: ["jit", "performance"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      hasWithStatement: true
    minSemanticSimilarity: 0
    minStructuralConfidence: 1.0

  - id: "ts:jit-spread-in-hot-path"
    category: "optimization"
    severity: "medium"
    name: "Spread Operator in Hot Path"
    description: "Spread creates new objects/arrays every iteration and propagates shape polymorphism from the source"
    suggestion: "Use explicit property assignment {id: item.id, name: item.name} for consistent shapes in loops"
    benchmark: "~1.4x slower polymorphic, up to 3.5x slower megamorphic access"
    tags: ["jit", "performance"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      minSpreadInCalls: 4
      hasLoops: true
    customDetector: "checkSpreadInHotPath"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.6

  - id: "ts:jit-dynamic-property-access"
    category: "optimization"
    severity: "low"
    name: "Dynamic Property Access in Loop"
    description: "obj[variable] is inherently megamorphic — the JIT cannot cache a fixed offset when the property name varies"
    suggestion: "Use Map for dynamic key-value storage. Reserve plain objects for static, known shapes"
    benchmark: "~3.5x slower megamorphic vs monomorphic property access"
    tags: ["jit", "performance"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      minDynamicPropertyAccess: 5
      hasLoops: true
    customDetector: "checkDynamicPropertyInLoop"
    exemplarIds: ["ts:jit-dynamic-prop:bad1"]
    minSemanticSimilarity: 0.55
    minStructuralConfidence: 0.5

  - id: "ts:jit-megamorphic-interface"
    category: "optimization"
    severity: "low"
    name: "Megamorphic Interface (5+ Implementations)"
    description: "Interface with 5+ implementations causes megamorphic dispatch at call sites — IC falls back to global hash table"
    suggestion: "Split into type-specific batches or use discriminated unions with switch for monomorphic branches"
    benchmark: "~3.5x slower megamorphic dispatch, up to 60x with IC overflow"
    tags: ["jit", "performance"]
    enabled: true
    structural:
      entityTypes: ["interface"]
      relationships:
        - type: "implements"
          direction: "incoming"
          minCount: 5
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "ts:jit-optional-chaining-hot"
    category: "optimization"
    severity: "low"
    name: "Excessive Optional Chaining"
    description: "Many optional chaining accesses (?.) imply multiple possible object shapes at each level — polymorphic IC"
    suggestion: "Normalize data at the boundary into fully-populated structures before entering hot code paths"
    tags: ["jit", "performance"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
    customDetector: "checkExcessiveOptionalChaining"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.5
