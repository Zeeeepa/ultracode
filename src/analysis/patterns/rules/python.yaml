patterns:
  # Anti-patterns
  - id: "py:bare-except"
    category: "anti-pattern"
    severity: "high"
    name: "Bare Except Clause"
    description: "Bare 'except:' catches all exceptions including SystemExit and KeyboardInterrupt"
    suggestion: "Use 'except Exception:' or catch specific exceptions"
    tags: ["error-handling"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      hasExceptions: true
    customDetector: "checkBareExcept"
    exemplarIds: ["py:bare-except:bad1"]
    minSemanticSimilarity: 0.55
    minStructuralConfidence: 0.5

  - id: "py:mutable-default-arg"
    category: "anti-pattern"
    severity: "high"
    name: "Mutable Default Argument"
    description: "Mutable default argument ([], {}) is shared across all calls to the function"
    suggestion: "Use None as default and create mutable inside function: if arg is None: arg = []"
    tags: ["correctness", "gotcha"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
    customDetector: "checkMutableDefaultArg"
    exemplarIds: ["py:mutable-default:bad1"]
    minSemanticSimilarity: 0.6
    minStructuralConfidence: 0.7

  - id: "py:global-state"
    category: "anti-pattern"
    severity: "medium"
    name: "Global Mutable State"
    description: "Module-level mutable variable — shared state causes hard-to-track bugs"
    suggestion: "Encapsulate state in a class or use dependency injection"
    tags: ["state", "architecture"]
    enabled: true
    structural:
      entityTypes: ["variable"]
      forbiddenModifiers: ["const"]
    exemplarIds: ["py:global-state:bad1"]
    minSemanticSimilarity: 0.6
    minStructuralConfidence: 0.5

  - id: "py:no-type-hints"
    category: "code-smell"
    severity: "low"
    name: "Missing Type Hints"
    description: "Public function without type annotations — reduces IDE support and documentation"
    suggestion: "Add type hints: def func(x: int) -> str:"
    tags: ["type-safety", "documentation"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
    customDetector: "checkNoTypeHints"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.5

  - id: "py:star-import"
    category: "anti-pattern"
    severity: "medium"
    name: "Star Import"
    description: "'from module import *' pollutes namespace and makes dependencies unclear"
    suggestion: "Import specific names: 'from module import Class1, func2'"
    tags: ["imports", "readability"]
    enabled: true
    structural:
      entityTypes: ["import"]
    customDetector: "checkStarImport"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.8

  - id: "py:no-docstring"
    category: "code-smell"
    severity: "low"
    name: "Missing Docstring"
    description: "Public function/class without docstring"
    suggestion: "Add a docstring describing purpose, parameters, and return value"
    tags: ["documentation"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function", "class"]
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.5

  # Best patterns
  - id: "py:context-manager"
    category: "best-pattern"
    severity: "info"
    name: "Context Manager Usage"
    description: "Using 'with' statement for resource management — ensures cleanup"
    suggestion: "Good pattern! Context managers ensure resources are always released."
    tags: ["resource-management", "quality"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
    exemplarIds: ["py:context-manager:good1"]
    minSemanticSimilarity: 0.6
    minStructuralConfidence: 0.4

  - id: "py:type-annotations"
    category: "best-pattern"
    severity: "info"
    name: "Fully Typed Function"
    description: "Function with complete type annotations — excellent for tooling and docs"
    suggestion: "Good pattern! Type hints improve code quality and IDE support."
    tags: ["type-safety", "quality"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.6

  - id: "py:generator-pattern"
    category: "best-pattern"
    severity: "info"
    name: "Generator Pattern"
    description: "Using yield for lazy evaluation — memory-efficient for large datasets"
    suggestion: "Good pattern! Generators avoid loading entire dataset into memory."
    tags: ["performance", "memory", "quality"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
    exemplarIds: ["py:generator:good1"]
    minSemanticSimilarity: 0.6
    minStructuralConfidence: 0.4

  # Optimization
  - id: "py:list-comprehension-over-loop"
    category: "optimization"
    severity: "low"
    name: "Loop Instead of Comprehension"
    description: "Manual loop to build list can often be replaced with list comprehension"
    suggestion: "Use [expr for x in iterable if condition] — more Pythonic and 30-50% faster"
    bigO:
      before: "O(n)"
      after: "O(n)"
    benchmark: "30-50% faster due to C-level optimization"
    tags: ["performance", "pythonic"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      hasLoops: true
    exemplarIds: ["py:list-comp:bad1"]
    minSemanticSimilarity: 0.6
    minStructuralConfidence: 0.4

  - id: "py:string-concat-in-loop"
    category: "optimization"
    severity: "medium"
    name: "String Concatenation in Loop"
    description: "String += in loop creates new string on each iteration"
    suggestion: "Use str.join() or io.StringIO for building strings"
    bigO:
      before: "O(n^2)"
      after: "O(n)"
    benchmark: "10-100x faster for large strings"
    tags: ["performance", "memory", "strings"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      hasLoops: true
    exemplarIds: ["py:string-concat-loop:bad1"]
    minSemanticSimilarity: 0.6
    minStructuralConfidence: 0.5

  # ─── pythonHints-based rules ─────────────────────────────────────────

  - id: "py:swallowed-exception"
    category: "anti-pattern"
    severity: "high"
    name: "Swallowed Exception"
    description: "except X: pass silently swallows exceptions, hiding real bugs"
    suggestion: "At minimum log the exception: except X as e: logger.exception(e)"
    tags: ["error-handling", "debugging"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      hasExceptions: true
      minExceptPass: 1
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "py:generic-raise"
    category: "anti-pattern"
    severity: "medium"
    name: "Generic Exception Raise"
    description: "raise Exception(...) / raise BaseException — callers cannot selectively catch"
    suggestion: "Define domain-specific exceptions: raise UserNotFoundError(...)"
    tags: ["error-handling", "api-design"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      minGenericRaise: 1
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "py:wide-try"
    category: "code-smell"
    severity: "medium"
    name: "Wide Try Block"
    description: "Try block >10 lines — catches unrelated exceptions, masks real errors"
    suggestion: "Wrap only the specific line(s) that can raise, not the whole function"
    tags: ["error-handling", "readability"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      hasExceptions: true
      minWideTryBlock: 1
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "py:type-ignore-no-code"
    category: "code-smell"
    severity: "low"
    name: "Blanket type: ignore"
    description: "'# type: ignore' without error code suppresses ALL mypy errors on the line"
    suggestion: "Use specific code: # type: ignore[assignment] or fix the type error"
    tags: ["type-safety"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      minTypeIgnore: 1
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.8

  - id: "py:any-abuse"
    category: "code-smell"
    severity: "medium"
    name: "Excessive Any Type Usage"
    description: "Multiple 'Any' annotations — defeats the purpose of type checking"
    suggestion: "Use specific types, TypeVar, Protocol, or Union instead of Any"
    tags: ["type-safety"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      minAnyType: 2
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.8

  - id: "py:eval-exec"
    category: "anti-pattern"
    severity: "critical"
    name: "eval/exec Usage"
    description: "eval() and exec() execute arbitrary code — major security risk"
    suggestion: "Use ast.literal_eval for data parsing, or refactor to avoid dynamic execution"
    tags: ["security", "correctness"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      minEvalExec: 1
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.9

  - id: "py:string-concat-loop-hint"
    category: "optimization"
    severity: "medium"
    name: "String Concatenation in Loop (parser-detected)"
    description: "str += in loop detected by parser — O(n²) memory allocation"
    suggestion: "Use parts = []; parts.append(x); ''.join(parts)"
    bigO:
      before: "O(n²)"
      after: "O(n)"
    tags: ["performance", "memory"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      hasPyStringConcatInLoop: true
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.8

  - id: "py:open-without-with"
    category: "anti-pattern"
    severity: "high"
    name: "open() Without Context Manager"
    description: "open() without 'with' risks resource leak if exception occurs"
    suggestion: "Use 'with open(path) as f:' to ensure file is always closed"
    tags: ["resource-management", "correctness"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      hasPyOpenWithoutWith: true
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.8

  - id: "py:async-no-await"
    category: "anti-pattern"
    severity: "high"
    name: "Async Function Without Await"
    description: "async def without await — adds coroutine overhead for no benefit"
    suggestion: "Remove 'async' keyword or add proper await calls"
    tags: ["concurrency", "performance"]
    enabled: true
    structural:
      entityTypes: ["async_function"]
      hasPyAsyncNoAwait: true
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.9

  # ─── Pandas rules (YAML-only + custom detector) ─────────────────────

  - id: "py:pd-iterrows"
    category: "optimization"
    severity: "high"
    name: "DataFrame.iterrows() Usage"
    description: "iterrows() is extremely slow — 100-1000x slower than vectorized ops"
    suggestion: "Use df.apply(), df.itertuples(), or vectorized operations"
    bigO:
      before: "O(n) with Python overhead per row"
      after: "O(n) vectorized (C-level)"
    benchmark: "100-1000x faster with vectorized operations"
    tags: ["pandas", "performance"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      callsInclude: ["\\.iterrows"]
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.8

  - id: "py:pd-apply"
    category: "optimization"
    severity: "medium"
    name: "DataFrame.apply() Anti-pattern"
    description: "apply() is slow — often a hidden Python loop over rows"
    suggestion: "Use vectorized pandas/numpy operations: df['col'].str.*, np.where, etc."
    benchmark: "10-100x faster with vectorized ops"
    tags: ["pandas", "performance"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      callsInclude: ["\\.apply"]
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.6

  - id: "py:pd-append-in-loop"
    category: "anti-pattern"
    severity: "high"
    name: "DataFrame.append() in Loop"
    description: "append() in loop creates new DataFrame each iteration — O(n²)"
    suggestion: "Collect as list of dicts, then pd.DataFrame(rows) or pd.concat()"
    bigO:
      before: "O(n²)"
      after: "O(n)"
    benchmark: "100x+ faster for large datasets"
    tags: ["pandas", "performance"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      callsInclude: ["\\.append"]
      hasLoops: true
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "py:pd-concat-in-loop"
    category: "anti-pattern"
    severity: "high"
    name: "pd.concat() in Loop"
    description: "concat() in loop copies entire DataFrame each time — O(n²)"
    suggestion: "Collect DataFrames in list, then single pd.concat(dfs)"
    bigO:
      before: "O(n²)"
      after: "O(n)"
    tags: ["pandas", "performance"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      callsInclude: ["concat"]
      hasLoops: true
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "py:pd-dot-values"
    category: "code-smell"
    severity: "low"
    name: "DataFrame.values Usage"
    description: ".values returns numpy array with potential dtype conversion — use .to_numpy()"
    suggestion: "Use df.to_numpy() or df['col'].to_numpy() for explicit conversion"
    tags: ["pandas", "correctness"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      callsInclude: ["\\.values$"]
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.5

  - id: "py:pd-groupby-apply"
    category: "optimization"
    severity: "medium"
    name: "groupby().apply() Pattern"
    description: "groupby().apply() runs Python function per group — slow for simple aggregations"
    suggestion: "Use built-in aggregations: df.groupby('col').agg({'val': 'sum'})"
    tags: ["pandas", "performance"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      callsInclude: ["\\.groupby"]
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.5

  - id: "py:pd-merge-no-validate"
    category: "code-smell"
    severity: "medium"
    name: "merge() Without validate"
    description: "merge() without validate= silently creates duplicates on key collision"
    suggestion: "Add validate='one_to_one' or validate='many_to_one' to catch key issues"
    tags: ["pandas", "correctness"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      callsInclude: ["\\.merge"]
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.5

  - id: "py:pd-chained-indexing"
    category: "anti-pattern"
    severity: "high"
    name: "Chained Indexing Assignment"
    description: "df['a']['b'] = val — SettingWithCopyWarning, may not update original"
    suggestion: "Use df.loc[row, 'col'] = val for reliable assignment"
    tags: ["pandas", "correctness"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
    customDetector: "checkPdChainedIndexing"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.6

  - id: "py:pd-inplace-true"
    category: "anti-pattern"
    severity: "medium"
    name: "inplace=True Parameter"
    description: "inplace=True returns None, breaks method chaining, harder to debug"
    suggestion: "Use df = df.dropna() instead of df.dropna(inplace=True)"
    tags: ["pandas", "api-design"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
    customDetector: "checkPdInplaceTrue"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "py:pd-missing-copy"
    category: "anti-pattern"
    severity: "medium"
    name: "DataFrame Slice Without .copy()"
    description: "Assigning DataFrame slice without .copy() — SettingWithCopyWarning"
    suggestion: "Use df_new = df[mask].copy() to create independent DataFrame"
    tags: ["pandas", "correctness"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
    customDetector: "checkPdMissingCopy"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.5

  - id: "py:pd-nan-comparison"
    category: "anti-pattern"
    severity: "critical"
    name: "NaN Equality Comparison"
    description: "== None or == np.nan always returns False — NaN != NaN by IEEE 754"
    suggestion: "Use pd.isna(), pd.notna(), or np.isnan() for NaN checks"
    tags: ["pandas", "correctness"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
    customDetector: "checkPdNanComparison"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.8

  - id: "py:pd-csv-no-dtype"
    category: "code-smell"
    severity: "low"
    name: "read_csv Without dtype"
    description: "read_csv() without dtype= — auto-inference is slow and may pick wrong types"
    suggestion: "Specify dtype={'col': 'int32'} or dtype={'col': 'category'} for efficiency"
    tags: ["pandas", "performance"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      callsInclude: ["read_csv"]
    customDetector: "checkPdCsvNoDtype"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.5

  - id: "py:pd-itertuples"
    category: "optimization"
    severity: "low"
    name: "DataFrame.itertuples() Usage"
    description: "itertuples() is faster than iterrows but still slower than vectorized ops"
    suggestion: "Consider vectorized operations or numpy for best performance"
    tags: ["pandas", "performance"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      callsInclude: ["\\.itertuples"]
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.5

  # ─── NumPy rules ────────────────────────────────────────────────────

  - id: "py:np-append-in-loop"
    category: "anti-pattern"
    severity: "high"
    name: "np.append() in Loop"
    description: "np.append() copies entire array each time — O(n²)"
    suggestion: "Pre-allocate with np.empty() or collect in list then np.array()"
    bigO:
      before: "O(n²)"
      after: "O(n)"
    tags: ["numpy", "performance"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      callsInclude: ["np\\.append"]
      hasLoops: true
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "py:np-deprecated-alias"
    category: "anti-pattern"
    severity: "medium"
    name: "NumPy Deprecated Type Alias"
    description: "np.bool, np.int, np.float etc. are deprecated since NumPy 1.24"
    suggestion: "Use Python builtins: bool, int, float or np.bool_, np.int64, np.float64"
    tags: ["numpy", "deprecation"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      callsInclude: ["np\\.(bool|int|float|complex|object|str)$"]
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.8

  - id: "py:np-matrix"
    category: "anti-pattern"
    severity: "medium"
    name: "np.matrix Usage"
    description: "np.matrix is deprecated — use np.ndarray with @ operator instead"
    suggestion: "Replace np.matrix(x) with np.array(x) and use @ for matrix multiplication"
    tags: ["numpy", "deprecation"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      callsInclude: ["np\\.matrix"]
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.8

  - id: "py:np-loop"
    category: "optimization"
    severity: "high"
    name: "Python Loop Over NumPy Array"
    description: "Accessing numpy arrays element-by-element in Python loop defeats vectorization"
    suggestion: "Use numpy vectorized operations: arr * 2 instead of for i in range(len(arr)): arr[i] * 2"
    bigO:
      before: "O(n) with Python overhead per element"
      after: "O(n) vectorized (C-level)"
    benchmark: "10-100x faster with vectorized ops"
    tags: ["numpy", "performance"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      hasLoops: true
    customDetector: "checkNpLoop"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.6

  - id: "py:np-float-cmp"
    category: "anti-pattern"
    severity: "high"
    name: "Float Equality Comparison"
    description: "== on floating-point values — fails due to IEEE 754 precision"
    suggestion: "Use np.isclose(a, b) or np.allclose(a, b) for float comparisons"
    tags: ["numpy", "correctness"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
    customDetector: "checkNpFloatCmp"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.6

  # ─── Scikit-learn rules ─────────────────────────────────────────────

  - id: "py:sk-data-leakage"
    category: "anti-pattern"
    severity: "critical"
    name: "Data Leakage: fit_transform Before Split"
    description: "Fitting scaler/encoder on full dataset before train_test_split leaks test info"
    suggestion: "Split first, then fit_transform on train only: scaler.fit(X_train); scaler.transform(X_test)"
    tags: ["sklearn", "correctness", "ml"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      callsInclude: ["fit_transform", "train_test_split"]
    customDetector: "checkSkDataLeakage"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "py:sk-no-pipeline"
    category: "code-smell"
    severity: "medium"
    name: "Multiple fit_transform Without Pipeline"
    description: "Sequential fit_transform calls without Pipeline — error-prone and hard to maintain"
    suggestion: "Use sklearn.pipeline.Pipeline or make_pipeline for reproducible workflows"
    tags: ["sklearn", "architecture", "ml"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
    customDetector: "checkSkNoPipeline"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.6

  - id: "py:sk-no-random-state"
    category: "code-smell"
    severity: "medium"
    name: "sklearn Without random_state"
    description: "ML estimator/splitter without random_state — non-reproducible results"
    suggestion: "Always set random_state=42 (or any fixed seed) for reproducibility"
    tags: ["sklearn", "reproducibility", "ml"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
    customDetector: "checkSkNoRandomState"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.6

  - id: "py:sk-cv-leakage"
    category: "anti-pattern"
    severity: "critical"
    name: "Cross-validation Leakage"
    description: "fit_transform before cross_val_score — preprocessing leaks into validation folds"
    suggestion: "Use Pipeline to ensure preprocessing is inside CV: make_pipeline(scaler, model)"
    tags: ["sklearn", "correctness", "ml"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      callsInclude: ["fit_transform", "cross_val_score"]
    customDetector: "checkSkCvLeakage"
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.7

  - id: "py:sk-accuracy"
    category: "code-smell"
    severity: "medium"
    name: "accuracy_score on Imbalanced Data"
    description: "accuracy_score misleads on imbalanced datasets — 95% accuracy may mean 'predict majority class'"
    suggestion: "Use classification_report, f1_score, roc_auc_score, or precision_recall_curve"
    tags: ["sklearn", "correctness", "ml"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      callsInclude: ["accuracy_score"]
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.5

  - id: "py:sk-predict-no-fit"
    category: "anti-pattern"
    severity: "high"
    name: "predict() Without fit()"
    description: "Calling predict() without fit() in scope — model may be unfitted"
    suggestion: "Ensure model.fit(X_train, y_train) before model.predict(X_test)"
    tags: ["sklearn", "correctness", "ml"]
    enabled: true
    structural:
      entityTypes: ["method", "function", "async_function"]
      callsInclude: ["\\.predict"]
      callsExclude: ["\\.fit"]
    minSemanticSimilarity: 0
    minStructuralConfidence: 0.6

  # ─── Matplotlib rules ───────────────────────────────────────────────

  - id: "py:plt-show-loop"
    category: "optimization"
    severity: "medium"
    name: "plt.show() in Loop"
    description: "plt.show() in loop blocks execution — creates separate windows per iteration"
