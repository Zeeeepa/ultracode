name: Build Kotlin K2 CLI

on:
  push:
    paths:
      - 'kotlin-k2-cli/**'
    tags:
      - 'k2-cli-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build fat JAR
        working-directory: kotlin-k2-cli
        run: ./gradlew fatJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-k2-cli
          path: kotlin-k2-cli/build/libs/*-all.jar

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/k2-cli-v')
        uses: softprops/action-gh-release@v1
        with:
          files: kotlin-k2-cli/build/libs/*-all.jar
          generate_release_notes: true
